flutter_native_splash:
  # ── Native splash is JUST the brand green — no logo, no text ──
  # The logo appears on the Dart splash that follows immediately.
  # This makes the transition seamless: green → green + logo → Home
  color: "#0A3A22"
  color_dark: "#0A3A22"

  android_12:
    color: "#0A3A22"
    color_dark: "#0A3A22"
    icon_background_color: "#0A3A22"
    icon_background_color_dark: "#0A3A22"

  android: true
  ios: true
  web: false
  fullscreen: true
