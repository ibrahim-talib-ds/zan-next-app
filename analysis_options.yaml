include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # These come from FlutterFlow-generated code and library deprecations.
    # They don't affect functionality. Suppressed to reduce noise.
    unused_import: ignore
    unnecessary_import: ignore
    unused_element: ignore
    unused_field: ignore
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    use_build_context_synchronously: ignore
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    prefer_final_fields: ignore
    unnecessary_null_comparison: ignore
    dead_code: ignore
    body_might_complete_normally_catch_error: ignore
    unawaited_return_in_try_block: ignore
    override_on_non_overriding_member: ignore
    unused_catch_clause: ignore
    unused_local_variable: ignore
    missing_return: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
